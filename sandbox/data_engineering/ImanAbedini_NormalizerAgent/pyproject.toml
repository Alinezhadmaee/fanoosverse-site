[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fanos-normalizer"
version = "0.1.0"
description = "Fanos LLM Normalizer Agent: canonicalizes raw job-ad field values (Persian/English) with deterministic-first rules and a provider-agnostic LLM fallback layer."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
]

[project.scripts]
normalizer = "normalizer_agent.interface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
normalizer_agent = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
# The anyio pytest plugin can hang at interpreter shutdown with the asyncio
# plugin; this suite uses pytest-asyncio exclusively.
addopts = "-p no:anyio"
markers = [
    "live: golden tests against real providers (opt-in, needs API keys)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["normalizer_agent", "run_pipeline"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
